<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Splashes Swim School | Sign In</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
    <header class="site-header site-header-home" id="site-header">
        <div class="brand-wrap">
            <a href="index.html" class="brand" aria-label="Splashes home">
                <img src="images/shark-full.png" alt="Splashes shark logo" class="brand-shark">
                <span class="brand-text">Splashes</span>
            </a>
        </div>

        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
            <span class="nav-toggle-lines" aria-hidden="true"></span>
        </button>

        <nav class="site-nav" id="site-nav" aria-label="Main navigation">
            <a href="about.html">About</a>
            <a href="lessons.html">Swimming Lessons</a>
            <a href="programs.html">Swim Programs</a>
            <a href="adult-programs.html">Adult Programs</a>
            <a href="locations.html">Locations</a>
            <a href="contact.html">Contact</a>
            <a class="nav-cta" href="register.html">Register / Sign In</a>
        </nav>
    </header>

    <main class="auth-main" aria-label="Sign in page">
        <div class="auth-logo" aria-hidden="true">
            <span class="auth-logo-text">Splashes</span>
            <span class="auth-logo-waves">
                <i></i>
                <i></i>
                <i></i>
            </span>
        </div>

        <section class="auth-card-wrap">
            <img src="images/shark-full.png" alt="" class="auth-shark" aria-hidden="true">

            <div class="auth-card">
                <h1>SIGN IN</h1>

                <form class="auth-form" action="#" method="post">
                    <label for="email">Email&nbsp;&nbsp;*</label>
                    <input id="email" name="email" type="email" autocomplete="email" required>

                    <label for="password">Password&nbsp;&nbsp;*</label>
                    <input id="password" name="password" type="password" autocomplete="current-password" required>

                    <a href="#" class="auth-forgot">Forgot Password?</a>

                    <div class="auth-actions">
                        <button type="submit" class="auth-btn auth-btn-signin">Sign In</button>
                        <a href="#" class="auth-btn auth-btn-signup">Sign Up</a>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
